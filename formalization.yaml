  "project": {
    "name": "Uniform permanence of endotactic reaction networks with measurable rates",
    "description": "Uniform permanence is established for finite endotactic reaction networks with arbitrary real complexes and measurable rate coefficients bounded above and away from zero almost everywhere. Each positive stoichiometric compatibility class contains a compact convex forward-invariant absorbing set, with entry times uniform over compact sets of initial conditions and all rate histories within a fixed rate box. Global positive Carathéodory solutions exist and are unique, and an exponential continuous-dependence estimate holds for initial data under a common rate history on a compact positive region. The result resolves the Endotactic Permanence Conjecture stated as Conjecture 1.3 by Johnston, Pantea and Donnell (https://arxiv.org/abs/1412.4662), using an ordinary-endotactic drift estimate together with the finite affine barrier construction from OpenAI’s work on weakly reversible networks.",
